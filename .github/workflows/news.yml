              ]

              if any(
                  word in t
                  for word in health
              ):

                  return "Səhiyyə"


              # =====================================================
              # 4 — TEXNOLOGİYA
              # =====================================================

              technology = [

                  "süni intellekt",
                  "süni zəka",
                  " ai ",
                  "artificial intelligence",
                  "texnologiya",
                  "texnoloji",
                  "internet",
