name: Azerbaijan News Update

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Repository-ni yüklə
        uses: actions/checkout@v4

      - name: Python qur
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Kitabxanaları qur
        run: |
          pip install feedparser deep-translator

      - name: Azərbaycan xəbərlərini topla və tərcümə et
        run: |
          python <<'PY'
          import feedparser
          import json
          import time
          from datetime import datetime, timezone
          from deep_translator import GoogleTranslator

          feeds = [
              {
                  "name": "AZƏRTAC",
                  "url": "https://azertag.az/rss"
              },
              {
                  "name": "Google News - Azərbaycan",
                  "url": "https://news.google.com/rss/search?q=Azərbaycan&hl=az&gl=AZ&ceid=AZ:az"
              }
          ]

          translator = GoogleTranslator(
              source="auto",
              target="az"
          )

          def detect_category(title):

              t = title.lower()

              if any(x in t for x in [
                  "futbol", "basketbol", "voleybol", "tennis",
                  "idman", "olimpiya", "çempionat", "matç",
                  "football", "sport"
              ]):
                  return "İdman"

              if any(x in t for x in [
                  "iqtisadiyyat", "manat", "dollar", "bank",
                  "neft", "qaz", "investisiya", "vergi", "büdcə",
                  "экономика", "доллар", "банк", "нефть"
              ]):
                  return "İqtisadiyyat"

              if any(x in t for x in [
                  "süni intellekt", "ai", "texnologiya",
                  "internet", "telefon", "kompüter", "rəqəmsal",
                  "технология", "интернет"
              ]):
                  return "Texnologiya"

              if any(x in t for x in [
                  "prezident", "nazir", "parlament",
                  "millət vəkili", "siyasi", "hökumət", "seçki",
                  "президент", "министр", "парламент", "выборы"
              ]):
                  return "Siyasət"

              if any(x in t for x in [
                  "qəza", "yanğın", "partlayış", "cinayət",
                  "həbs", "xəsarət", "vəfat", "hadisə",
                  "авария", "пожар", "взрыв", "арест"
              ]):
                  return "Hadisə"

              if any(x in t for x in [
                  "səhiyyə", "xəstəxana", "həkim", "təhsil",
                  "məktəb", "universitet", "cəmiyyət",
                  "здоровье", "больница", "образование", "школа"
              ]):
                  return "Cəmiyyət"

              return "Azərbaycan"

          def translate_title(title):

              try:
                  result = translator.translate(title)

                  if result:
                      return result.strip()

              except Exception as e:
                  print("Tərcümə xətası:", e)

              return title

          articles = []
          seen = set()

          for feed in feeds:

              try:

                  data = feedparser.parse(feed["url"])

                  for item in data.entries[:30]:

                      original_title = item.get(
                          "title", ""
                      ).strip()

                      link = item.get(
                          "link", ""
                      ).strip()

                      if not original_title or not link:
                          continue

                      if link in seen:
                          continue

                      seen.add(link)

                      translated_title = translate_title(
                          original_title
                      )

                      category = detect_category(
                          translated_title + " " + original_title
                      )

                      articles.append({
                          "title_original": original_title,
                          "title": translated_title,
                          "language": "az",
                          "link": link,
                          "source": feed["name"],
                          "published": item.get(
                              "published", ""
                          ),
                          "category": category,
                          "country": "Azerbaijan"
                      })

                      time.sleep(0.5)

              except Exception as e:

                  print(
                      "Feed xətası:",
                      feed["name"],
                      e
                  )

          result = {
              "updated": datetime.now(
                  timezone.utc
              ).isoformat(),

              "country": "Azerbaijan",

              "articles": articles[:60]
          }

          with open(
              "news.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "Toplanan xəbərlər:",
              len(articles)
          )

          PY

      - name: Xəbərləri GitHub-a yadda saxla
        run: |
          git config user.name "RR NEWS AI"
          git config user.email "actions@github.com"

          git add news.json

          if git diff --cached --quiet; then
            echo "Yeni xəbər yoxdur."
          else
            git commit -m "Auto update Azerbaijan news with translation"
            git push
          fi
