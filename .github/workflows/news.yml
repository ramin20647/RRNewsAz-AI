                  "inflyasiya",
                  "maaş",
                  "əmək haqqı",
                  "ixrac",
                  "idxal",
                  "şirkət",
                  "səhm",
                  "maliyyə",
                  "faiz dərəcəsi",
                  "iqtisadi artım",
                  "экономика",
                  "доллар",
                  "евро",
                  "банк",
                  "нефть",
                  "газ",
                  "инвестиции",
                  "налог",
                  "бюджет",
                  "финансы"
              ]

              if any(
                  word in t
                  for word in economy
              ):

                  return "İqtisadiyyat"


              # =====================================================
              # 9 — MƏDƏNİYYƏT
              # =====================================================

              culture = [

                  "mədəniyyət",
                  "kino",
                  "film",
                  "musiqi",
                  "teatr",
                  "sənət",
                  "incəsənət",
                  "aktyor",
                  "müğənni",
                  "festival",
                  "kitab",
                  "ədəbiyyat",
                  "culture",
                  "music",
                  "cinema",
                  "theater",
                  "театр",
                  "музыка",
                  "кино",
                  "культура"
              ]

              if any(
                  word in t
                  for word in culture
              ):

                  return "Mədəniyyət"


              # =====================================================
              # 10 — EKOLOGİYA
              # =====================================================

              ecology = [

                  "ekologiya",
                  "iqlim",
                  "qlobal istiləşmə",
                  "ətraf mühit",
                  "meşə",
                  "meşələr",
                  "su ehtiyatları",
                  "çirklənmə",
                  "tullantı",
                  "yaşıllıq",
                  "iqlim dəyişikliyi",
                  "climate",
                  "environment",
                  "pollution",
                  "global warming",
                  "ecology",
                  "экология",
                  "климат",
                  "окружающая среда"
              ]

              if any(
                  word in t
                  for word in ecology
              ):

                  return "Ekologiya"


              # =====================================================
              # 11 — CƏMİYYƏT
              # =====================================================

              society = [

                  "təhsil",
                  "məktəb",
                  "universitet",
                  "şagird",
                  "tələbə",
                  "cəmiyyət",
                  "sosial",
                  "ailə",
                  "uşaq",
                  "gənclər",
                  "əmək",
                  "sosial yardım",
                  "təqaüd",
                  "education",
                  "school",
                  "university",
                  "student",
                  "society",
                  "образование",
                  "школа",
                  "университет",
                  "общество"
              ]

              if any(
                  word in t
                  for word in society
              ):

                  return "Cəmiyyət"


              # =====================================================
              # 12 — SİYASƏT
              # =====================================================

              politics = [

                  "prezident",
                  "baş nazir",
                  "nazir",
                  "parlament",
                  "millət vəkili",
                  "deputat",
                  "siyasi",
                  "siyasət",
                  "hökumət",
                  "seçki",
                  "referendum",
                  "partiya",
                  "dövlət başçısı",
                  "politika",
                  "political",
                  "president",
                  "prime minister",
                  "minister",
                  "parliament",
                  "election",
                  "government",
                  "президент",
                  "премьер-министр",
                  "министр",
                  "парламент",
                  "выборы",
                  "правительство"
              ]

              if any(
                  word in t
                  for word in politics
              ):

                  return "Siyasət"


              # =====================================================
              # 13 — DÜNYA
              # =====================================================

              world = [

                  "dünya",
                  "xarici ölkə",
                  "xaricdə",
                  "abş",
                  "amerika",
                  "birləşmiş ştatlar",
                  "rusiya",
                  "ukrayna",
                  "iran",
                  "israil",
                  "fələstin",
                  "türkiyə",
                  "çin",
                  "avropa",
                  "fransa",
                  "almaniya",
                  "ingiltərə",
                  "böyük britaniya",
                  "italiya",
                  "ispaniya",
                  "gürcüstan",
                  "ermənistan",
                  "qazaxıstan",
                  "özbəkistan",
                  "world",
                  "usa",
                  "america",
                  "russia",
                  "ukraine",
                  "iran",
                  "israel",
                  "palestine",
                  "turkey",
                  "china",
                  "europe",
                  "france",
                  "germany",
                  "uk",
                  "italy",
                  "spain",
                  "georgia",
                  "armenia",
                  "world news",
                  "мир",
                  "россия",
                  "украина",
                  "иран",
                  "израиль",
                  "китай",
                  "европа"
              ]

              if any(
                  word in t
                  for word in world
              ):

                  return "Dünya"


              # =====================================================
              # 14 — KRİMİNAL
              # =====================================================

              criminal = [

                  "cinayət",
                  "qətl",
                  "öldürüldü",
                  "oğurluq",
                  "soyğun",
                  "quldurluq",
                  "dələduzluq",
                  "narkotik",
                  "həbs edildi",
                  "saxlanıldı",
                  "polis əməliyyatı",
                  "məhkəmə",
                  "məhkum",
                  "prokurorluq",
                  "korrupsiya",
                  "rüşvət",
                  "cinayət işi",
                  "crime",
                  "murder",
                  "robbery",
                  "theft",
                  "fraud",
                  "drugs",
                  "arrested",
                  "court",
                  "corruption",
                  "преступление",
                  "убийство",
                  "кража",
                  "наркотики",
                  "арест"
              ]

              if any(
                  word in t
                  for word in criminal
              ):

                  return "Kriminal"


              # =====================================================
              # 15 — AZƏRBAYCAN
              # =====================================================

              return "Azərbaycan"


          # =========================================================
          # FAYLLARI YÜKLƏ
          # =========================================================

          news_data = load_json(
              "news.json"
          )

          archive_data = load_json(
              "archive.json"
          )

          active = news_data.get(
              "articles",
              []
          )

          archive = archive_data.get(
              "articles",
              []
          )


          # =========================================================
          # TƏKRAR XƏBƏRLƏRİ QARŞISINI AL
          # =========================================================

          known_links = {
              article.get("link")
              for article in (
                  active + archive
              )
              if article.get("link")
          }


          new_articles = []


          # =========================================================
          # RSS-LƏRİ OXU
          # =========================================================

          for feed in feeds:

              try:

                  print(
                      "Feed yoxlanılır:",
                      feed["name"]
                  )

                  data = feedparser.parse(
                      feed["url"]
                  )

                  for item in data.entries[:50]:

                      original = item.get(
                          "title",
                          ""
                      ).strip()

                      link = item.get(
                          "link",
                          ""
                      ).strip()

                      if not original or not link:
                          continue

                      if link in known_links:
                          continue


                      # ---------------------------------------------
                      # TARİX
                      # ---------------------------------------------

                      published_dt = get_published(
                          item
                      )


                      # 24 saatdan köhnə yeni xəbər qəbul edilmir
                      if published_dt < CUTOFF:
                          continue


                      # ---------------------------------------------
                      # TƏRCÜMƏ
                      # ---------------------------------------------

                      translated = translate_title(
                          original
                      )


                      # ---------------------------------------------
                      # KATEQORİYA
                      # ---------------------------------------------

                      category_text = (
                          translated
                          + " "
                          + original
                      )

                      category = detect_category(
                          category_text
                      )


                      # ---------------------------------------------
                      # ŞƏKİL
                      # ---------------------------------------------

                      image = get_image(
                          item
                      )


                      # ---------------------------------------------
                      # XƏBƏR OBYEKTİ
                      # ---------------------------------------------

                      article = {

                          "title_original":
                              original,

                          "title":
                              translated,

                          "language":
                              "az",

                          "category":
                              category,

                          "link":
                              link,

                          "source":
                              feed["name"],

                          "published":
                              published_dt.isoformat(),

                          "country":
                              "Azerbaijan",

                          "image":
                              image
                      }


                      new_articles.append(
                          article
                      )

                      known_links.add(
                          link
                      )


                      print(
                          "Yeni:",
                          translated,
                          "→",
                          category,
                          "→ şəkil:",
                          "VAR" if image else "YOXDUR"
                      )


                      time.sleep(
                          0.4
                      )


              except Exception as e:

                  print(
                      "Feed xətası:",
                      feed["name"],
                      e
                  )


          # =========================================================
          # YENİ XƏBƏRLƏRİ AKTİV XƏBƏRLƏRƏ ƏLAVƏ ET
          # =========================================================

          active.extend(
              new_articles
          )


          # =========================================================
          # 24 SAATLIQ ARXİV SİSTEMİ
          # =========================================================

          still_active = []
          moved = []


          for article in active:

              try:

                  published_dt = datetime.fromisoformat(
                      article.get(
                          "published",
                          ""
                      ).replace(
                          "Z",
                          "+00:00"
                      )
                  )

              except Exception:

                  published_dt = NOW


              age = NOW - published_dt


              if age >= timedelta(
                  hours=24
              ):

                  moved.append(
                      article
                  )

              else:

                  still_active.append(
                      article
                  )


          # =========================================================
          # ARXİVƏ TƏKRAR XƏBƏR DÜŞMƏSİN
          # =========================================================

          archive_links = {
              article.get("link")
              for article in archive
              if article.get("link")
          }


          for article in moved:

              link = article.get(
                  "link"
              )

              if link not in archive_links:

                  archive.append(
                      article
                  )

                  archive_links.add(
                      link
                  )


          # =========================================================
          # SIRALAMA
          # =========================================================

          still_active.sort(
              key=lambda x:
                  x.get(
                      "published",
                      ""
                  ),
              reverse=True
          )


          archive.sort(
              key=lambda x:
                  x.get(
                      "published",
                      ""
                  ),
              reverse=True
          )


          # =========================================================
          # NEWS.JSON
          # =========================================================

          save_json(
              "news.json",
              {
                  "updated":
