name: Azerbaijan News Update

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:

      - name: Repository-ni yüklə
        uses: actions/checkout@v4

      - name: Python qur
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Kitabxanaları qur
        run: |
          pip install feedparser deep-translator

      - name: Xəbərləri topla, kateqoriyalaşdır və arxivlə
        run: |
          python <<'PY'

          import feedparser
          import json
          import os
          import re
          import html
          import time

          from datetime import datetime, timezone, timedelta
          from urllib.parse import urljoin

          from deep_translator import GoogleTranslator


          # =========================================================
          # RSS MƏNBƏLƏRİ
          # =========================================================

          feeds = [
              {
                  "name": "AZƏRTAC",
                  "url": "https://azertag.az/rss"
              },
              {
                  "name": "Google News - Azərbaycan",
                  "url": "https://news.google.com/rss/search?q=Azərbaycan&hl=az&gl=AZ&ceid=AZ:az"
              }
          ]


          # =========================================================
          # ZAMAN
          # =========================================================

          NOW = datetime.now(timezone.utc)

          # 24 saatdan köhnə aktiv xəbərlər arxivə keçir
          CUTOFF = NOW - timedelta(hours=24)


          # =========================================================
          # TƏRCÜMƏ
          # =========================================================

          translator = GoogleTranslator(
              source="auto",
              target="az"
          )


          # =========================================================
          # JSON OXU
          # =========================================================

          def load_json(filename):

              if not os.path.exists(filename):
                  return {
                      "articles": []
                  }

              try:

                  with open(
                      filename,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      return json.load(f)

              except Exception as e:

                  print(
                      "JSON oxuma xətası:",
                      filename,
                      e
                  )

                  return {
                      "articles": []
                  }


          # =========================================================
          # JSON YAZ
          # =========================================================

          def save_json(filename, data):

              with open(
                  filename,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      data,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )


          # =========================================================
          # BAŞLIĞI TƏRCÜMƏ ET
          # =========================================================

          def translate_title(title):

              try:

                  result = translator.translate(title)

                  if result:
                      return result.strip()

              except Exception as e:

                  print(
                      "Tərcümə xətası:",
                      e
                  )

              return title


          # =========================================================
          # XƏBƏR TARİXİ
          # =========================================================

          def get_published(item):

              parsed = (
                  item.get("published_parsed")
                  or item.get("updated_parsed")
              )

              if parsed:

                  try:

                      return datetime(
                          parsed.tm_year,
                          parsed.tm_mon,
                          parsed.tm_mday,
                          parsed.tm_hour,
                          parsed.tm_min,
                          parsed.tm_sec,
                          tzinfo=timezone.utc
                      )

                  except Exception:
                      pass

              return NOW


          # =========================================================
          # ŞƏKİL TAPMA SİSTEMİ
          # =========================================================

          def get_image(item):

              # 1. media_content
              try:

                  media = item.get(
                      "media_content",
                      []
                  )

                  for media_item in media:

                      url = media_item.get(
                          "url",
                          ""
                      )

                      if url:
                          return url

              except Exception:
                  pass


              # 2. media_thumbnail
              try:

                  thumbnails = item.get(
                      "media_thumbnail",
                      []
                  )

                  for thumb in thumbnails:

                      url = thumb.get(
                          "url",
                          ""
                      )

                      if url:
                          return url

              except Exception:
                  pass


              # 3. RSS enclosure
              try:

                  enclosures = item.get(
                      "enclosures",
                      []
                  )

                  for enclosure in enclosures:

                      href = enclosure.get(
                          "href",
                          ""
                      )

                      enc_type = enclosure.get(
                          "type",
                          ""
                      )

                      if href and (
                          enc_type.startswith("image")
                          or re.search(
                              r"\.(jpg|jpeg|png|webp)(\?|$)",
                              href,
                              re.IGNORECASE
                          )
                      ):

                          return href

              except Exception:
                  pass


              # 4. description / summary içindən <img src="">
              try:

                  html_text = (
                      item.get("summary", "")
                      or item.get("description", "")
                  )

                  html_text = html.unescape(
                      html_text
                  )

                  match = re.search(
                      r'<img[^>]+src=["\']([^"\']+)["\']',
                      html_text,
                      re.IGNORECASE
                  )

                  if match:

                      return match.group(1)

              except Exception:
                  pass


              # 5. content içindən şəkil
              try:

                  contents = item.get(
                      "content",
                      []
                  )

                  for content in contents:

                      value = content.get(
                          "value",
                          ""
                      )

                      value = html.unescape(
                          value
                      )

                      match = re.search(
                          r'<img[^>]+src=["\']([^"\']+)["\']',
                          value,
                          re.IGNORECASE
                      )

                      if match:

                          return match.group(1)

              except Exception:
                  pass


              return ""


          # =========================================================
          # KATEQORİYA SİSTEMİ
          #
          # PRIORITET:
          #
          # Son Hadisələr
          # Hərb
          # Səhiyyə
          # Texnologiya
          # Elm
          # Nəqliyyat
          # İdman
          # İqtisadiyyat
          # Mədəniyyət
          # Ekologiya
          # Cəmiyyət
          # Siyasət
          # Dünya
          # Kriminal
          # Azərbaycan
